<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nihongo App - Kanji & Vocab</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Configuración básica de Tailwind para colores corporativos (opcional) -->
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#EF4444', secondary: '#1F2937' } }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header App -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
            <h1 class="text-xl font-bold text-primary flex items-center gap-2">
                <i data-lucide="book-open"></i> Nihongo App
            </h1>
            
            <!-- Controles de Datos (Exportar / Importar) -->
            <div class="flex items-center gap-3">
                <button id="btn-export" class="p-2 text-gray-500 hover:text-primary transition-colors" title="Exportar Progreso">
                    <i data-lucide="download"></i>
                </button>
                <label class="p-2 text-gray-500 hover:text-primary transition-colors cursor-pointer" title="Importar Progreso">
                    <i data-lucide="upload"></i>
                    <input type="file" id="input-import" accept=".json" class="hidden">
                </label>
            </div>
        </div>
    </header>

    <!-- Contenedor Dinámico -->
    <main id="app-view" class="flex-grow max-w-4xl mx-auto w-full p-4">
        <!-- JS inyectará el contenido aquí -->
        <div class="flex justify-center items-center h-full">
            <i data-lucide="loader-2" class="animate-spin text-primary w-8 h-8"></i>
        </div>
    </main>

    <!-- Punto de entrada JS (ES Module) -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
